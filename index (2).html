<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        .popup-container {
  position: fixed;
  transform: translate(0, 0);
  padding: 20px;
  background-color: white;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  animation: dropIn 1s forwards;
}

@keyframes dropIn {
  0% {
    top: -50%;
    right: 20px;
    transform: translate(0, 0)
    opacity: 0;
  }
  100% {
    top: 10px;
    right: 20px;
    opacity: 1;
  }
}

.popup-container p {
  margin: 0 0 10px;
  font-size: 16px;
  color: #333;
}

.popup-container input {
  padding: 10px;
  margin-bottom: 10px;
  border: 1px solid #ddd;
  border-radius: 5px;
  width: 100%;
  box-sizing: border-box;
}

.popup-container button {
  padding: 10px 20px;
  border: none;
  border-radius: 5px;
  background-color: #007bff;
  color: white;
  cursor: pointer;
  transition: background-color 0.3s;
}

.popup-container button:hover {
  background-color: #0056b3;
}

    </style>
    <body>
        <script src="/Users/dylanarts/Documents/GitHub/cookie-killer/popup.js"></script>

    </body>
</html>
